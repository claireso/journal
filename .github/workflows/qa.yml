name: QA

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          persist-credentials: false
      - name: Setup Node & install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Create directory "uploads"
        run: mkdir uploads
      - name: Test
        run: npm run test

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          persist-credentials: false
      - name: Setup Node & install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Lint
        run: npm run lint

  tsc:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          persist-credentials: false
      - name: Setup Node & install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Type checking
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          persist-credentials: false
      - name: Setup Node & install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Create .env
        uses: SpicyPizza/create-envfile@ace6d4f5d7802b600276c23ca417e669f1a06f6f # v2.0
        with:
          file_name: .env
          envkey_BETTER_AUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          envkey_BETTER_AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          envkey_BETTER_STACK_CLIENT_SOURCE_TOKEN: ${{secrets.BETTER_STACK_CLIENT_SOURCE_TOKEN}}
          envkey_BETTER_STACK_HEALTH_CHECK_TOKEN: ${{secrets.BETTER_STACK_HEALTH_CHECK_TOKEN}}
          envkey_BETTER_STACK_INGESTING_URL: ${{secrets.BETTER_STACK_INGESTING_URL}}
          envkey_BETTER_STACK_SOURCE_TOKEN: ${{secrets.BETTER_STACK_SOURCE_TOKEN}}
          envkey_LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          envkey_NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
          envkey_NEXT_PUBLIC_NOTIFICATIONS_PUBLIC_KEY: ${{ secrets.NOTIFICATIONS_PUBLIC_KEY }}
          envkey_NEXT_PUBLIC_SERVICEWORKER_VERSION: ${{ secrets.SERVICEWORKER_VERSION }}
          envkey_NOTIFICATIONS_PRIVATE_KEY: ${{ secrets.NOTIFICATIONS_PRIVATE_KEY }}
          envkey_NOTIFICATIONS_SUBJECT: ${{ secrets.NOTIFICATIONS_SUBJECT }}
          envkey_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          envkey_OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          envkey_OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME }}
          envkey_POSTGRES_DB: ${{ secrets.DB_NAME }}
          envkey_POSTGRES_HOST: ${{ secrets.DB_HOST }}
          envkey_POSTGRES_USER: ${{ secrets.DB_USER }}
          envkey_POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          envkey_POSTGRES_PORT: ${{ secrets.DB_PORT }}
          envkey_WEBSITE_LANGUAGE: ${{ vars.WEBSITE_LANGUAGE }}
          envkey_WEBSITE_META_DESCRIPTION: ${{ vars.WEBSITE_META_DESCRIPTION }}
          envkey_WEBSITE_META_TITLE: ${{ vars.WEBSITE_META_TITLE }}
          envkey_WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
      - name: Build
        run: npm run build
