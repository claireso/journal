name: Release

on:
  workflow_run:
    workflows: [QA]
    branches: master
    types: [completed]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch all history and tags
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Setup Node & install dependencies
        uses: ./.github/actions/setup-node-deps
      - name: Create directory "uploads"
        run: mkdir uploads
      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          commit-message: Release new version
          pr-title: Release new version
          publish-script: npx changeset git-tag
